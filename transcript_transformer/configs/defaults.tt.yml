# NEW MODEL
lr : 0.00013
max_memory : 180000
scheduler : decay
decay_rate : 0.95

# input params
use_seq : true
input_type: hdf5
# hdf5 structure
exp_path : transcript
y_path : tis
seqn_path : seqname
id_path : transcript_id
# results params
prob_cutoff : 0.03
# model architecture
num_tokens: 8
dim: 64 
depth: 8
heads: 8
dim_head: 24 
ff_glu: false
emb_dropout: 0.1
ff_dropout: 0.1
attn_dropout: 0.1
local_window_size: 256
local_attn_heads: 4
# internal params
mlm : false
mask_frac : false
rand_frac : false
